
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: telematicos-mqtt-broker
    restart: unless-stopped

    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"

    volumes:
      - "./infrastructure/mosquitto/config:/mosquitto/config:ro"
      - "./infrastructure/mosquitto/data:/mosquitto/data"
      - "./infrastructure/mosquitto/log:/mosquitto/log"
